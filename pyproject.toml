[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lue-reader"
version = "0.5.0"
description = "A terminal-based eBook reader with modular text-to-speech capabilities and multi-format support"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Lue contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
    "Environment :: Console",
]
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.2.0",
    "striprtf>=0.0.29",
    "rich>=14.1.0",
    "PyMuPDF>=1.26.3",
    "Markdown>=3.8.2",
    "platformdirs>=4.3.8",
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
kokoro = [
    "kokoro>=0.9.4",
    "soundfile>=0.13.1",
    "huggingface-hub>=0.34.4",
]
openai = [
    "openai>=1.0.0",
]
nanogpt = [
    "httpx>=0.27.0",
]
speechify = [
    "httpx>=0.27.0",
]
free = [
    "gTTS>=2.5.0",
]
capcut = [
    # Pinned to an immutable commit SHA (upstream publishes no tags; branch
    # heads are moving targets). Refresh deliberately, then update this SHA and
    # the install note in VOICES.md:
    #   git ls-remote https://github.com/K07VN/capcut-tts-api main
    # PEP 508 note: PyPI has no capcut-tts-api release, so this extra only
    # resolves with pip/VCS support (pip, uv). Tools without git+ support will
    # skip/fail this extra; the provider is optional either way.
    "capcut-tts-api @ git+https://github.com/K07VN/capcut-tts-api@7ab87fbd12cbafa60bea4a48903eddf42a939b07",
    "requests>=2.25.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "openai>=1.0.0",
]

[project.scripts]
lue = "lue.__main__:cli"

[project.urls]
Homepage = "https://github.com/paulilaaso/lue"
Repository = "https://github.com/paulilaaso/lue"
Issues = "https://github.com/paulilaaso/lue/issues"

[tool.setuptools.packages.find]
include = ["lue*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Tests that verify individual functions/units in isolation",
    "integration: Tests that verify interactions between multiple components",
]

[tool.setuptools.package-data]
lue = ["py.typed", "guide.txt", "*.json"]
